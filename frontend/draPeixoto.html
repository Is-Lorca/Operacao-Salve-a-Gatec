<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pagina Dra. Peixoto</title>
    <link rel="stylesheet" href="src/styles/reset.css" />
    <link rel="stylesheet" href="src/styles/style.css" />
    <link rel="stylesheet" href="src/styles/mochila.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bitcount:wght@100..900&family=Jersey+10&family=Tiny5&display=swap"
      rel="stylesheet"
    />
  </head>
  <body id="bodyPersona">
    <div>
      <audio id="audio" preload="metadata" loop>
          <source src="src/music/Chalk_and_Starlight.mp3" type="audio/mp3">
      </audio>
  
      <button id="botaoAudio">
          <img 
          id="iconMute"
          src="src/img/opcoes audio/Audio3.png">
      </button>
    </div>

    <header>
      <h1 id="tituloMateria"></h1>
    </header>
    
    <section id="telaPrincipal">
      <div id="janelaPersona">
        <figure id="imagemfundo">
          <img src="src/img/cenário dra peixoto.gif" alt="cenario" />
        </figure>
        <figure id="drapeixoto">
          <img src="src/img/dragatinha.gif" alt="drapeixoto" />
        </figure>
      </div>

      <div id="caixadialogo">
        <p id="falaPersona"></p>
        <div id="espaçoBotao">
          <button id="bt1" class="botaousuario">(Começar)</button>
          <button id="bt2" class="botaousuario">Reiniciar</button>
        </div>
      </div>
    </section>
    <!-- Componente da Mochila / Inventário -->
    <div class="hud-inventario" id="hudInventario">
        <button type="button" class="mochila-trigger" aria-label="Abrir Inventário">
            🎒
        </button>

        <div class="mochila-drawer">
            <div class="mochila-header">
                <span>Inventário</span>
                <span id="mochilaCapacidade">0/3</span>
            </div>
            <!-- slots -->
            <div class="mochila-slots" id="mochilaSlots"></div>
            <!-- detalhes dos itens -->
            <div class="mochila-tooltip" id="mochilaTooltip" hidden>
                <strong id="tooltipNome"></strong>
                <p id="tooltipDesc"></p>
                <small id="tooltipMeta"></small>
            </div>
        </div>
    </div>
    <script src="src/javascript/musica.js"></script>
    <script src="src/javascript/dialogo.js"></script>
    <script type="module" src="src/javascript/mochila.js"></script>
  </body>
</html>
