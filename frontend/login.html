<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="src/styles/reset.css" />
    <link rel="stylesheet" href="src/styles/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Bitcount:wght@100..900&family=Jersey+10&family=Tiny5&display=swap"
        rel="stylesheet"
    />
</head>
<body>
    <header>
        <h1>Login</h1>
    </header>

    <section>
        <div>
            <form action="" method="post">
                <div>
                    <label for="usuario">Usuario:</label>
                    <input type="text" size="20" id="usuario" name="email" placeholder="E-mail" required>
                </div>

                <div>
                    <label for="senha">Senha:</label>
                    <input type="password" size="20" id="senha" name="senha" required>
                </div>

                <div>
                    <button>Entrar</button>
                </div>
            </form>
        </div>
    </section>


</body>
</html>
