
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Desafio Final</title>

    <link rel="stylesheet" href="src/styles/reset.css">
    <link rel="stylesheet" href="src/styles/mochila.css">
    <link rel="stylesheet" href="src/styles/desafioFinal.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Bitcount:wght@100..900&family=Jersey+10&family=Tiny5&display=swap"
        rel="stylesheet">
</head>

<body>

    <!-- TELA PRINCIPAL -->
    <section id="telaPrincipal">

        <div id="janelaPersona">

            <figure id="imagemfundo">
                <img src="./src/img/cenário mister plutonio.gif" alt="Cenário do Mr. Plutônio">
            </figure>

            <figure id="mrplutonio">
                <img src="./src/img/mrplutonio.gif" alt="Mr. Plutônio">
            </figure>

        </div>

    </section>

    <!-- TELA INICIAL -->
    <section id="telaInicial">

        <div id="caixadialogo">

            <p id="falaPersona">
                Caramba! Nunca pensei que você fosse chegar tão longe...
                Mas não se anime demais! Você realmente acha que pode salvar a Gatec?
                Eu nunca perco um bom investimento!
            </p>

            <div id="espaçoBotao">

                <button id="botaoIniciar" class="botaousuario">
                    Começar
                </button>

            </div>

        </div>

    </section>

    <!-- TELA DAS PERGUNTAS -->
    <section id="telaPerguntas" hidden>

        <header id="cabecalhoProva">

            <span id="progresso">
                Questão 1 de 10
            </span>

            <span id="pontuacao">
                Pontos: 0
            </span>

        </header>

        <div id="barraProgresso">
            <div id="preenchimentoProgresso"></div>
        </div>

        <div id="areaQuestao">

            <h2 id="enunciado"></h2>

            <div id="alternativas"></div>

            <p id="feedback"></p>

            <button id="botaoConfirmar" disabled>
                Confirmar resposta
            </button>

            <button id="botaoProxima" hidden>
                Próxima questão
            </button>

        </div>

    </section>

    <!-- COMPONENTE DA MOCHILA / INVENTÁRIO -->
    <div class="hud-inventario" id="hudInventario">

        <button type="button" class="mochila-trigger" aria-label="Abrir Inventário">
            🎒
        </button>

        <div class="mochila-drawer">

            <div class="mochila-header">
                <span>Inventário</span>
                <span id="mochilaCapacidade">0/3</span>
            </div>

            <!-- SLOTS -->
            <div class="mochila-slots" id="mochilaSlots"></div>

            <!-- DETALHES DOS ITENS -->
            <div class="mochila-tooltip" id="mochilaTooltip" hidden>
                <strong id="tooltipNome"></strong>
                <p id="tooltipDesc"></p>
                <small id="tooltipMeta"></small>
            </div>

        </div>

    </div>

    <!-- TELA DO RESULTADO -->
    <section id="telaResultado" hidden>

        <img
            id="imagemEnding"
            src=""
            alt="Imagem do final do desafio"
            hidden>
        </img>

        <h1 id="tituloResultado">
            Resultado Final
        </h1>

        <p id="quantidadeAcertos"></p>

        <p id="pontuacaoFinal"></p>

        <h2 id="classificacao"></h2>

        <button id="botaoReiniciar">
            Voltar
        </button>

    </section>

    <!-- JAVASCRIPT -->
    <script type="module" src="src/javascript/desafioFinal.js"></script>
    <script type="module" src="src/javascript/mochila.js"></script>

</body>

</html>
