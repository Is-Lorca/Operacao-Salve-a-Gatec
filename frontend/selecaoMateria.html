<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seleção de Materia</title>
    <link rel="stylesheet" href="src/styles/reset.css" />
    <link rel="stylesheet" href="src/styles/style.css" />
    <link rel="stylesheet" href="src/styles/mochila.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bitcount:wght@100..900&family=Jersey+10&family=Tiny5&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <h1 id="tituloMateria">Escolha uma Matéria:</h1>
    <section class="painelMateria">
        <button data-materia="proposicao" class="botaoMateria">
            Proposição
        </button>
        <button data-materia="tabelaVerdade" class="botaoMateria">
            Tabela Verdade
        </button>
        <button data-materia="conjuntos" class="botaoMateria">
            Conjuntos
        </button>
        <button data-materia="planoCartesiano" class="botaoMateria">
            Plano/Produto Cartesiano
        </button>
      <!-- Marcando final de  coluna -->
        <button data-materia="relacaoBinaria" class="botaoMateria">
            Relação Binária
        </button>
        <button data-materia="funcoes" class="botaoMateria">
            Funções
        </button>
        <button data-materia="equacaoReta" class="botaoMateria">
            Equação de uma Reta
        </button>
    </section>
    <!-- Componente da Mochila / Inventário -->
    <div class="hud-inventario" id="hudInventario">
        <button type="button" class="mochila-trigger" aria-label="Abrir Inventário">
            🎒
        </button>

        <div class="mochila-drawer">
            <div class="mochila-header">
                <span>Inventário</span>
                <span id="mochilaCapacidade">0/3</span>
            </div>
            <!-- slots -->
            <div class="mochila-slots" id="mochilaSlots"></div>
            <!-- detalhes dos itens -->
            <div class="mochila-tooltip" id="mochilaTooltip" hidden>
                <strong id="tooltipNome"></strong>
                <p id="tooltipDesc"></p>
                <small id="tooltipMeta"></small>
            </div>
        </div>
    </div>
    <script src="src/javascript/escolhaMateria.js"></script>
    <script type="module" src="src/javascript/mochila.js"></script>
  </body>
</html>
