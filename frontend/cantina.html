<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cantina</title>

    <link rel="stylesheet" href="src/styles/reset.css" />
    <link rel="stylesheet" href="src/styles/cantina.css">
    <link rel="stylesheet" href="src/styles/mochila.css">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
        href="https://fonts.googleapis.com/css2?family=Bitcount:wght@100..900&family=Jersey+10&family=Tiny5&display=swap"
        rel="stylesheet"
    />
</head>

<body>
    <!-- Componente da Mochila / Inventário -->
    <div class="hud-inventario" id="hudInventario">
        <button type="button" class="mochila-trigger" aria-label="Abrir Inventário">
            🎒
        </button>

        <div class="mochila-drawer">
            <div class="mochila-header">
                <span>Inventário</span>
                <span id="mochilaCapacidade">0/3</span>
            </div>
            <!-- slots -->
            <div class="mochila-slots" id="mochilaSlots"></div>
            <!-- detalhes dos itens -->
            <div class="mochila-tooltip" id="mochilaTooltip" hidden>
                <strong id="tooltipNome"></strong>
                <p id="tooltipDesc"></p>
                <small id="tooltipMeta"></small>
            </div>
        </div>
    </div>
    <header>
        <div>
            <figure id="campoMoeda">
                <img src="src/img/campoMoeda.png" alt="campoDeMoeda">
                <h2></h2>
            </figure>
        </div>

        <div id="botaoSair">
            <a href="selecaoMateria.html">
                <img src="src/img/Botao.png" alt="botao">
            </a>
        </div>
    </header>

    <section id="telaPersona">

        <div id="telaPersonagem">

            <figure id="cenarioCantina">
                <img src="src/img/CenarioCantina.png" alt="cenario">
            </figure>

            <figure id="donaOdete">
                <img src="src/img/DonaOdete.gif" alt="donaOdete">
            </figure>

            <figure id="balcao">
                <img src="src/img/Balcao.png" alt="balcao">
            </figure>

        </div>

    </section>

    <section>
        <div id="itens" aria-live="polite"></div>
    </section>

    <script type="module" src="src/javascript/cantina.js"></script>
    <script type="module" src="src/javascript/mochila.js"></script>
</body>

</html>
