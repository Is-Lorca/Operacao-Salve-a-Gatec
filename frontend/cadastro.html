<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="src/styles/reset.css" />
    <link rel="stylesheet" href="src/styles/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Bitcount:wght@100..900&family=Jersey+10&family=Tiny5&display=swap"
        rel="stylesheet"
    />
</head>
<body>
    <header>
        <h1>Casdastro</h1>
    </header>

    <section>
        <div>
            <label for="nome">Nome:</label>
            <input type="text" size="20" id="nome" name="nome" required>
        </div>

        <div>
            <label for="email">E-mail:</label>
            <input type="text" size="20" id="email" name="email" required>
        </div>

        <div>
            <label for="senha">Senha:</label>
            <input type="password" size="20" id="senha" name="senha" required>
        </div>

        <div>
            <label for="confirmarSenha">Confirmar Senha:</label>
            <input type="password" size="20" id="confirmarSenha" name="confirmarSenha" required>
        </div>

        <div>
            <button>Cadastrar-se</button>
        </div>
    </section>


</body>
</html>
